worker_processes 1;
pid /tmp/velxio-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/velxio-client;
    proxy_temp_path /tmp/velxio-proxy;
    fastcgi_temp_path /tmp/velxio-fastcgi;
    uwsgi_temp_path /tmp/velxio-uwsgi;
    scgi_temp_path /tmp/velxio-scgi;
    client_max_body_size 2m;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        # PL strips its prefix before proxying. The frontend's relative URLs
        # and this runtime configuration preserve that prefix in the browser.
        location = /workspace-config.js {
            alias /tmp/velxio-workspace-config.js;
            add_header Cache-Control no-store;
        }
        location = /health { proxy_pass http://127.0.0.1:8001/health; }
        location /api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_read_timeout 180s;
        }
        location /assets/ { try_files $uri =404; }
        location /monaco/ { try_files $uri =404; }
        location /fonts/ { try_files $uri =404; }
        location /boards/ { try_files $uri =404; }
        location /component-svgs/ { try_files $uri =404; }
        location /components/ { try_files $uri =404; }
        location /wasm/ { try_files $uri =404; }
        location = /components-metadata.json { try_files $uri =404; }
        location = /pl-adapter-source.tar.gz { try_files $uri =404; }
        location = / { try_files /index.html =404; }
        # The workspace has a single route. Marketing/docs/example routes
        # do not fall back to the application.
        location / { return 404; }
    }
}
