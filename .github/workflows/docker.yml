name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docker-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, type-check and the tests that need no toolchain, without Docker.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          python-version: '3.12'

      - name: Install
        run: uv sync --locked --all-packages

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Type-check grader
        working-directory: graders/arduino
        run: uv run --no-sync mypy

      - name: Test grader without the toolchain
        working-directory: graders/arduino
        run: uv run --no-sync pytest

      - name: Test course templates
        run: uv run --no-sync pytest

  arduino:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release
        if: startsWith(github.ref, 'refs/tags/')
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a stable release tag such as v1.0.0.' >&2
            exit 1
          fi
          {
            echo "version=${RELEASE_TAG#v}"
            echo "major=${BASH_REMATCH[1]}"
            echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"
          test -n "$DOCKERHUB_IMAGE" && test -n "$DOCKERHUB_USERNAME"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run test targets
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: test
          vars: LAYER_CACHE=gha

      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          load: true
          vars: LAYER_CACHE=gha
          set: |
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ steps.release.outputs.version || github.sha }}

      - name: Test workspace
        run: bash workspaces/arduino/tests/run.sh pl-arduino-workspace:dev

      - name: Grade template cases
        run: |
          for expected in graders/arduino/tests/cases/*/*/expected.json; do
            cases="${expected%/expected.json}"
            question="course/questions/${cases#graders/arduino/tests/cases/}"
            python3 scripts/grade.py --image pl-arduino-grader:dev --cases "$cases" "$question"
          done

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested images
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          VERSION: ${{ steps.release.outputs.version }}
          MINOR: ${{ steps.release.outputs.minor }}
          MAJOR: ${{ steps.release.outputs.major }}
        run: |
          for tag in "arduino-workspace-$VERSION" "arduino-workspace-$MINOR" "arduino-workspace-$MAJOR" arduino-workspace; do
            docker tag pl-arduino-workspace:dev "$DOCKERHUB_IMAGE:$tag"
            docker push "$DOCKERHUB_IMAGE:$tag"
          done
          for tag in "arduino-grader-$VERSION" "arduino-grader-$MINOR" "arduino-grader-$MAJOR" arduino-grader; do
            docker tag pl-arduino-grader:dev "$DOCKERHUB_IMAGE:$tag"
            docker push "$DOCKERHUB_IMAGE:$tag"
          done
